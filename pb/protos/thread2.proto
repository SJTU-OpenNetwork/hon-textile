syntax = "proto3";
option java_package = "sjtu.opennet.textilepb";
option go_package = "pb";

message Thread2 {
    string threadId =1;
}

message Thread2List {
 repeated Thread2 item =1;
}

message Thread2Peer {
    string id     = 1;
    int32 role      = 2;
}


message Thread2Invite {
    string peerId = 1;
    string threadId = 2;
    string dbAddr = 3;
    string dbKey =4;
}

message Thread2MessageUpdate {
    string threadId = 1;
    string collection =2;
    string instanceId =3;
    bytes  instance   = 4;
}